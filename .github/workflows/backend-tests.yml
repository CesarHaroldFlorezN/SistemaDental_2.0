name: Pruebas del backend

on:
  push:
    branches:
      - main
      - refactor/estructura-base
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar DentalPro
        run: python -m pip install -e ".[dev]"

      - name: Validar código con Ruff
        run: python -m ruff check backend tests main.py

      - name: Validar formato con Ruff
        run: python -m ruff format --check backend tests main.py

      - name: Ejecutar pruebas
        run: python -m pytest